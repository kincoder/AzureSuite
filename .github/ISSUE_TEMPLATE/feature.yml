name: Feature / task
description: Something new to build or change
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in, what's explicitly out. Mention affected services/projects.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria.
      placeholder: |
        - [ ] ...
        - [ ] Tests added, build warning-free
        - [ ] Docs in docs/services updated if behaviour changed
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: Specs, plans, progress-log entries, links.
