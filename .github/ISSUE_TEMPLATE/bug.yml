name: Bug
description: Something is broken or behaves wrongly
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Service / page / function, and environment (local or Azure).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: App Insights query results, workflow run links, screenshots.
