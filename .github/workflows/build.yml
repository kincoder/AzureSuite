name: Build and Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AzureSuite.slnx

      - name: Build
        run: dotnet build AzureSuite.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AzureSuite.slnx --no-build --configuration Release
