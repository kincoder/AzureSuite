name: Build and Test

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AzureSuite.slnx

      - name: Build
        run: dotnet build AzureSuite.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AzureSuite.slnx --no-build --configuration Release

  deploy-web:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy AzureSuite.Web.Blazor
    environment: azure-dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Substitute environment configuration
        run: |
          sed -i \
            -e "s|__CATALOG_API_BASE_URL__|${{ vars.CATALOG_API_BASE_URL }}|" \
            -e "s|__INGESTION_API_BASE_URL__|${{ vars.INGESTION_API_BASE_URL }}|" \
            -e "s|__APPLICATION_INSIGHTS_CONNECTION_STRING__|${{ vars.APPLICATION_INSIGHTS_CONNECTION_STRING }}|" \
            frontends/AzureSuite.Web.Blazor/wwwroot/appsettings.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontends/AzureSuite.Web.Blazor
          output_location: wwwroot

      - name: Verify deployment
        run: |
          for i in $(seq 1 10); do
            content=$(curl -sS -m 15 "${{ vars.WEB_BASE_URL }}/appsettings.json" || echo "")
            if [ -n "$content" ]; then
              break
            fi
            echo "Attempt $i: site not responding yet, retrying in 15s..."
            sleep 15
          done

          if [ -z "$content" ]; then
            echo "Site never responded"
            exit 1
          fi

          if echo "$content" | grep -qE "__CATALOG_API_BASE_URL__|__INGESTION_API_BASE_URL__"; then
            echo "appsettings.json still contains an unsubstituted placeholder"
            exit 1
          fi

          if ! echo "$content" | grep -qF "${{ vars.CATALOG_API_BASE_URL }}"; then
            echo "appsettings.json does not contain the expected Catalog API base URL"
            exit 1
          fi

          if ! echo "$content" | grep -qF "${{ vars.INGESTION_API_BASE_URL }}"; then
            echo "appsettings.json does not contain the expected Ingestion API base URL"
            exit 1
          fi

          echo "Deployment verified: appsettings.json correctly substituted"

  deploy-catalog-api:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Catalog.Api
    environment: azure-dev

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: rg-messaginghub-dev
      SQL_SERVER: sql-messaginghub-catalog-dev
      KEY_VAULT: kv-msghub-catalog-dev
      FIREWALL_RULE: gh-actions-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Migrations run before the new code is deployed, so the schema is in place when the
      # new version starts. If they fail, the deploy stops and the current version keeps running.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # dotnet ef reads project metadata before it builds, so the projects must be restored
      # first: this job starts from a fresh checkout.
      - name: Build migration bundle
        run: |
          dotnet restore services/Catalog/Catalog.Api/Catalog.Api.csproj
          dotnet ef migrations bundle \
            --project services/Catalog/Catalog.Infrastructure \
            --startup-project services/Catalog/Catalog.Api \
            --configuration Release \
            --output ./efbundle

      - name: Open SQL firewall for this runner
        id: firewall
        run: |
          runner_ip=$(curl -sS -m 15 https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$FIREWALL_RULE" \
            --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none

      - name: Apply database migrations
        run: |
          connection_string=$(az keyvault secret show --vault-name "$KEY_VAULT" --name catalog-db-connection-string --query value --output tsv)
          echo "::add-mask::$connection_string"
          ConnectionStrings__CatalogDb="$connection_string" ./efbundle

      - name: Close SQL firewall
        if: always() && steps.firewall.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$FIREWALL_RULE"

      - name: Publish
        run: dotnet publish services/Catalog/Catalog.Api/Catalog.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-messaginghub-catalog-dev
          publish-profile: ${{ secrets.AZURE_CATALOG_API_PUBLISH_PROFILE }}
          package: ./publish

      - name: Verify deployment health
        run: |
          for i in $(seq 1 10); do
            status=$(curl -sS -o /dev/null -m 15 -w "%{http_code}" "${{ vars.CATALOG_API_BASE_URL }}/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got HTTP $status, retrying in 15s..."
            sleep 15
          done

          echo "Health check failed after retries"
          curl -sS -m 15 "${{ vars.CATALOG_API_BASE_URL }}/health/verbose" || true
          exit 1

  deploy-ingestion-api:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Ingestion.Api
    environment: azure-dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish services/Ingestion/Ingestion.Api/Ingestion.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-messaginghub-ingestion-dev
          publish-profile: ${{ secrets.AZURE_INGESTION_API_PUBLISH_PROFILE }}
          package: ./publish

      - name: Verify deployment health
        run: |
          for i in $(seq 1 10); do
            status=$(curl -sS -o /dev/null -m 15 -w "%{http_code}" "${{ vars.INGESTION_API_BASE_URL }}/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got HTTP $status, retrying in 15s..."
            sleep 15
          done

          echo "Health check failed after retries"
          curl -sS -m 15 "${{ vars.INGESTION_API_BASE_URL }}/health/verbose" || true
          exit 1
