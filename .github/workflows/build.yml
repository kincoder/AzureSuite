name: Build and Test

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AzureSuite.slnx

      - name: Build
        run: dotnet build AzureSuite.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AzureSuite.slnx --no-build --configuration Release

  deploy-catalog-web:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Catalog.Web
    environment: azure-dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Substitute environment configuration
        run: |
          sed -i \
            -e "s|__CATALOG_API_BASE_URL__|${{ vars.CATALOG_API_BASE_URL }}|" \
            -e "s|__APPLICATION_INSIGHTS_CONNECTION_STRING__|${{ vars.APPLICATION_INSIGHTS_CONNECTION_STRING }}|" \
            frontends/Catalog.Web/wwwroot/appsettings.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontends/Catalog.Web
          output_location: wwwroot

  deploy-catalog-api:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Catalog.Api
    environment: azure-dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish services/Catalog/Catalog.Api/Catalog.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-messaginghub-catalog-dev
          publish-profile: ${{ secrets.AZURE_CATALOG_API_PUBLISH_PROFILE }}
          package: ./publish
